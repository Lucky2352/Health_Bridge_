<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Medical Codes - HealthBridge EMR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/futuristic-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .search-container {
            max-width: 1100px;
            margin: 1.75rem auto;
            background: #ffffff;
            border: 1px solid #d0dae6;
            border-radius: 14px;
            padding: 2rem;
            box-shadow: 0 4px 16px rgba(15,39,68,0.10);
        }
        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1.25rem;
            border-bottom: 2px solid #e3f0ff;
        }
        .search-title { font-size:1.2rem; font-weight:700; color:#0d1f35; margin:0; display:flex; align-items:center; gap:0.5rem; }
        .search-title i { color:#1976d2; }
        .back-btn {
            padding: 0.4rem 0.9rem;
            background: #f4f7fb;
            border: 1px solid #d0dae6;
            border-radius: 7px;
            color: #2c3e55;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.15s;
        }
        .back-btn:hover { background: #e3f0ff; color: #0d1f35; border-color: #1976d2; }

        .search-row { display:grid; grid-template-columns:1fr auto; gap:1rem; align-items:end; margin-bottom:1.5rem; }
        .search-input-wrap { position:relative; }
        .search-label { display:block; color:#0d1f35; font-weight:600; font-size:0.8rem; margin-bottom:0.35rem; }
        .search-input { width:100%; padding:0.65rem 1rem; background:#f4f7fb; border:1.5px solid #d0dae6; border-radius:8px; color:#0d1f35; font-size:0.95rem; font-family:'Inter',sans-serif; transition:border-color 0.15s,box-shadow 0.15s; box-sizing:border-box; outline:none; }
        .search-input:focus { border-color:#1976d2; box-shadow:0 0 0 3px rgba(25,118,210,0.12); background:#fff; }
        .search-input::placeholder { color:#a0adb8; }
        .autocomplete-dropdown { position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff; border:1.5px solid #d0dae6; border-radius:10px; z-index:999; max-height:300px; overflow-y:auto; box-shadow:0 8px 24px rgba(15,39,68,0.13); display:none; }
        .autocomplete-dropdown.open { display:block; }
        .ac-item { display:flex; align-items:center; justify-content:space-between; padding:0.6rem 1rem; cursor:pointer; border-bottom:1px solid #eef2f7; transition:background 0.1s; gap:1rem; }
        .ac-item:last-child { border-bottom:none; }
        .ac-item:hover, .ac-item.active { background:#e3f0ff; }
        .ac-name { color:#0d1f35; font-size:0.875rem; font-weight:500; }
        .ac-name em { color:#1976d2; font-style:normal; font-weight:700; }
        .ac-meta { display:flex; align-items:center; gap:0.4rem; flex-shrink:0; }
        .ac-code { background:#e2f5ec; color:#1b7a4a; padding:2px 7px; border-radius:5px; font-family:monospace; font-size:0.75rem; font-weight:700; }
        .ac-system { background:#e3f0ff; color:#1565c0; padding:2px 7px; border-radius:5px; font-size:0.7rem; font-weight:600; }
        .ac-loading { padding:0.85rem 1rem; text-align:center; color:#607080; font-size:0.83rem; }
        .search-btn { padding:0.65rem 1.4rem; background:#1976d2; border:none; border-radius:8px; color:#fff; font-weight:700; font-size:0.85rem; cursor:pointer; transition:all 0.15s; display:flex; align-items:center; gap:0.4rem; white-space:nowrap; }
        .search-btn:hover { background:#1565c0; box-shadow:0 4px 12px rgba(21,101,192,0.3); transform:translateY(-1px); }
        .search-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
        .loading-spinner { display:flex; justify-content:center; align-items:center; padding:2.5rem; gap:0.75rem; color:#607080; font-size:0.875rem; }
        .spinner { width:28px; height:28px; border:3px solid #d0dae6; border-top:3px solid #1976d2; border-radius:50%; animation:spin 0.8s linear infinite; flex-shrink:0; }
        .results-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.25rem; margin-top:1.5rem; }
        .results-card { background:#fff; border:1px solid #d0dae6; border-radius:10px; overflow:hidden; box-shadow:0 2px 8px rgba(15,39,68,0.07); }
        .results-header { padding:0.85rem 1.25rem; border-bottom:1px solid #eef2f7; }
        .results-header.namaste { background:#e3f0ff; border-bottom-color:#c5ddf5; }
        .results-header.icd11   { background:#e2f5ec; border-bottom-color:#a7d7bc; }
        .results-title { color:#0d1f35; font-weight:700; font-size:0.85rem; margin:0; display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
        .results-title i { color:#1976d2; }
        .results-header.icd11 .results-title i { color:#1b7a4a; }
        .results-table { width:100%; border-collapse:collapse; }
        .results-table th { background:#f4f7fb; color:#607080; font-weight:700; font-size:0.7rem; text-transform:uppercase; letter-spacing:0.6px; padding:0.6rem 1rem; text-align:left; border-bottom:1px solid #eef2f7; }
        .results-table td { padding:0.7rem 1rem; border-bottom:1px solid #f4f7fb; font-size:0.845rem; color:#2c3e55; }
        .results-table tr:last-child td { border-bottom:none; }
        .results-table tr:hover td { background:#f4f7fb; }
        .code-badge { background:#e3f0ff; color:#1565c0; padding:2px 8px; border-radius:5px; font-family:monospace; font-size:0.78rem; font-weight:700; }
        .code-badge.icd11 { background:#e2f5ec; color:#1b7a4a; }
        .system-badge { background:#eef2f7; color:#607080; padding:2px 8px; border-radius:5px; font-size:0.7rem; font-weight:600; }
        .system-badge.icd11 { background:#e2f5ec; color:#1b7a4a; }
        .ai-badge { background:#e3f0ff; color:#1565c0; padding:2px 8px; border-radius:5px; font-size:0.7rem; font-weight:700; }
        .translate-btn { padding:4px 10px; background:#fef3e2; border:1px solid #f0d9a0; border-radius:6px; color:#92400e; font-weight:600; font-size:0.72rem; cursor:pointer; transition:all 0.15s; }
        .translate-btn:hover { background:#fde68a; border-color:#d97706; }
        .no-results { text-align:center; padding:1.5rem; color:#8fa0b0; font-size:0.83rem; font-style:italic; }
        .error-message { background:#fee2e2; border:1px solid #fca5a5; color:#991b1b; padding:0.75rem 1rem; border-radius:8px; margin-top:1rem; font-size:0.845rem; }
        @keyframes spin { 0%{transform:rotate(0deg);}100%{transform:rotate(360deg);} }
        @media(max-width:768px) { .search-container{margin:1rem;padding:1.25rem;} .search-row{grid-template-columns:1fr;gap:0.75rem;} .results-grid{grid-template-columns:1fr;gap:1rem;} .search-header{flex-direction:column;gap:0.75rem;align-items:flex-start;} }
    </style>
</head>
<body style="background:#eef2f7;color:#2c3e55;">
<div class="dashboard-container">
    <div class="dashboard-sidebar">
        <div class="sidebar-header">
            <div style="display:flex;align-items:center;justify-content:center;gap:0.5rem;margin-bottom:0.5rem;">
                <img src="/static/logo.png" alt="HealthBridge Logo" style="width:32px;height:32px;object-fit:contain;">
                <h4 style="margin:0;">HealthBridge</h4>
            </div>
            <small>Doctor Portal</small>
        </div>
        <nav class="sidebar-nav">
            <a href="/enhanced/dashboard" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="/patients/add" class="nav-link"><i class="fas fa-user-plus"></i> New Patient</a>
            <a href="/patients/" class="nav-link"><i class="fas fa-users"></i> Patients</a>
            <a href="/treatments/" class="nav-link"><i class="fas fa-heartbeat"></i> Treatment Plans</a>
            <a href="/appointments/" class="nav-link"><i class="fas fa-calendar-check"></i> Appointments</a>
            <a href="/reports/" class="nav-link"><i class="fas fa-chart-line"></i> Reports</a>
            <a href="/fhir/" class="nav-link"><i class="fas fa-database"></i> FHIR</a>
            <a href="/search-page" class="nav-link"><i class="fas fa-search"></i> Search Code</a>
            <a href="/diagnosis-page" class="nav-link"><i class="fas fa-save"></i> Save Diagnosis</a>
            <a href="/history-page" class="nav-link"><i class="fas fa-history"></i> Patient History</a>
            <hr style="border:none;border-top:1px solid rgba(255,255,255,0.08);margin:0.75rem 0;">
            <a href="/enhanced/logout" class="nav-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="top-navbar">
            <div>
                <button class="mobile-menu-toggle" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></button>
                <h5><i class="fas fa-search"></i> Search Medical Codes</h5>
            </div>
        </div>

        <div class="content-area">
            <div class="search-container">
                <div class="search-header">
                    <h2 class="search-title"><i class="fas fa-search"></i> Medical Code Search</h2>
                    <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
                </div>

                <div class="search-row">
                    <div class="search-input-wrap">
                        <label class="search-label">Enter Disease, Symptom or Condition</label>
                        <input type="text" class="search-input" id="symptomInput"
                               placeholder="e.g., Jwara, Diabetes, Parkinson, Amavata, Dengue…"
                               autocomplete="off">
                        <div class="autocomplete-dropdown" id="acDropdown"></div>
                    </div>
                    <button class="search-btn" id="searchBtn" onclick="searchCodes()">
                        <i class="fas fa-search"></i> Search
                    </button>
                </div>

                <div id="loadingSpinner" class="loading-spinner" style="display:none;">
                    <div class="spinner"></div>
                </div>

                <div id="results" style="display:none;">
                    <div class="results-grid">
                        <!-- NAMASTE -->
                        <div class="results-card">
                            <div class="results-header namaste">
                                <h5 class="results-title">
                                    <i class="fas fa-leaf"></i> NAMASTE Codes (AYUSH)
                                    <span id="namasteSourceBadge" class="system-badge" style="font-size:0.7rem;"></span>
                                </h5>
                            </div>
                            <table class="results-table">
                                <thead><tr><th>Code</th><th>Name</th><th>System</th><th>Action</th></tr></thead>
                                <tbody id="namasteResults"></tbody>
                            </table>
                        </div>

                        <!-- ICD-11 -->
                        <div class="results-card">
                            <div class="results-header icd11">
                                <h5 class="results-title">
                                    <i class="fas fa-globe"></i> ICD-11 Codes (WHO)
                                    <span class="ai-badge">✨ AI Powered</span>
                                </h5>
                            </div>
                            <table class="results-table">
                                <thead><tr><th>Code</th><th>Condition Name</th><th>System</th></tr></thead>
                                <tbody id="icd11Results"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="errorMessage" class="error-message" style="display:none;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleMobileMenu() {
        document.querySelector('.dashboard-sidebar').classList.toggle('mobile-open');
    }

    // ── Autocomplete ──────────────────────────────────────────────────────────
    let acTimeout = null;
    let acIndex = -1;
    let acController = null;   // AbortController for in-flight suggest requests

    const input = document.getElementById('symptomInput');
    const dropdown = document.getElementById('acDropdown');

    input.addEventListener('input', function () {
        clearTimeout(acTimeout);
        const val = this.value.trim();
        if (val.length < 1) { closeDropdown(); return; }
        dropdown.innerHTML = '<div class="ac-loading"><i class="fas fa-spinner fa-spin"></i> Fetching suggestions…</div>';
        dropdown.classList.add('open');
        acTimeout = setTimeout(() => fetchSuggestions(val), 600);
    });

    input.addEventListener('keydown', function (e) {
        const items = dropdown.querySelectorAll('.ac-item');
        if (!items.length) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); acIndex = Math.min(acIndex + 1, items.length - 1); highlightItem(items); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); acIndex = Math.max(acIndex - 1, 0); highlightItem(items); }
        else if (e.key === 'Enter') {
            if (acIndex >= 0 && items[acIndex]) { items[acIndex].click(); }
            else { closeDropdown(); searchCodes(); }
        }
        else if (e.key === 'Escape') { closeDropdown(); }
    });

    document.addEventListener('click', function (e) {
        if (!e.target.closest('.search-input-wrap')) closeDropdown();
    });

    function highlightItem(items) {
        items.forEach((el, i) => el.classList.toggle('active', i === acIndex));
        if (items[acIndex]) items[acIndex].scrollIntoView({ block: 'nearest' });
    }

    function closeDropdown() {
        dropdown.classList.remove('open');
        dropdown.innerHTML = '';
        acIndex = -1;
    }

    async function fetchSuggestions(prefix) {
        // Cancel any previous in-flight request
        if (acController) acController.abort();
        acController = new AbortController();
        try {
            const res = await fetch(`/icd11/suggest?q=${encodeURIComponent(prefix)}`,
                { signal: acController.signal });
            const data = await res.json();
            renderSuggestions(data, prefix);
        } catch (e) {
            if (e.name !== 'AbortError') closeDropdown();
        }
    }

    function renderSuggestions(items, prefix) {
        if (!items || !items.length) { closeDropdown(); return; }
        acItems = items;
        acIndex = -1;
        const re = new RegExp(`(${prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        dropdown.innerHTML = items.map((item, i) => {
            const highlighted = item.name.replace(re, '<em>$1</em>');
            const sys = item.system || 'Modern';
            return `<div class="ac-item" data-index="${i}" onclick="selectSuggestion('${escHtml(item.name)}','${escHtml(item.icd_code)}')">
                <span class="ac-name">${highlighted}</span>
                <span class="ac-meta">
                    <span class="ac-code">${escHtml(item.icd_code)}</span>
                    <span class="ac-system">${escHtml(sys)}</span>
                </span>
            </div>`;
        }).join('');
        dropdown.classList.add('open');
    }

    function selectSuggestion(name, code) {
        input.value = name;
        closeDropdown();
        searchCodes();
    }

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Full search ───────────────────────────────────────────────────────────
    async function searchCodes() {
        const symptom = input.value.trim();
        if (!symptom) { showError('Please enter a disease or symptom.'); return; }
        closeDropdown();

        const btn = document.getElementById('searchBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Searching…';
        document.getElementById('loadingSpinner').style.display = 'flex';
        document.getElementById('results').style.display = 'none';
        document.getElementById('errorMessage').style.display = 'none';

        try {
            const res = await fetch(`/search?q=${encodeURIComponent(symptom)}`);
            const data = await res.json();
            if (res.ok) displayResults(data);
            else showError(data.error || 'Search failed');
        } catch (e) {
            showError('Network error: ' + e.message);
        } finally {
            document.getElementById('loadingSpinner').style.display = 'none';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-search"></i> Search';
        }
    }

    function displayResults(data) {
        const namasteTable = document.getElementById('namasteResults');
        const icd11Table   = document.getElementById('icd11Results');
        namasteTable.innerHTML = '';
        icd11Table.innerHTML   = '';

        // NAMASTE source badge
        const srcBadge = document.getElementById('namasteSourceBadge');
        srcBadge.textContent = data.namaste_source === 'api' ? 'Official API' : 'CSV Data';
        srcBadge.style.background = data.namaste_source === 'api' ? '#e2f5ec' : '#fef3e2';
        srcBadge.style.color = data.namaste_source === 'api' ? '#1b7a4a' : '#92400e';
        srcBadge.style.border = data.namaste_source === 'api' ? '1px solid #a7d7bc' : '1px solid #f0d9a0';

        // NAMASTE rows
        if (data.namaste && data.namaste.length) {
            data.namaste.forEach(item => {
                namasteTable.innerHTML += `<tr>
                    <td><span class="code-badge">${escHtml(item.code)}</span></td>
                    <td>${escHtml(item.name)}</td>
                    <td><span class="system-badge">${escHtml(item.system||'NAMASTE')}</span></td>
                    <td><button class="translate-btn" onclick="translateCode('${escHtml(item.code)}','${escHtml(item.name)}')">
                        <i class="fas fa-exchange-alt"></i> Translate
                    </button></td>
                </tr>`;
            });
        } else {
            namasteTable.innerHTML = '<tr><td colspan="4" class="no-results">No NAMASTE results found</td></tr>';
        }

        // ICD-11 rows
        if (data.icd11 && data.icd11.length) {
            icd11Table.innerHTML = `<tr><td colspan="3" style="color:#5b6b7d;font-size:0.82rem;padding-bottom:0.6rem;">
                ${data.icd11.length} related ICD-11 concept${data.icd11.length === 1 ? '' : 's'}, closest match first
            </td></tr>`;
            data.icd11.forEach(item => {
                icd11Table.innerHTML += `<tr>
                    <td><span class="code-badge icd11">${escHtml(item.code)}</span></td>
                    <td>${escHtml(item.name)}</td>
                    <td><span class="system-badge icd11">${escHtml(item.category||'ICD-11')}</span></td>
                </tr>`;
            });
        } else if (data.icd11_error) {
            // The server now distinguishes "the API is broken" from "nothing
            // matched", so report what actually went wrong rather than guessing.
            icd11Table.innerHTML = `<tr><td colspan="3" class="no-results">
                ICD-11 lookup unavailable &mdash; ${escHtml(data.icd11_error)}
            </td></tr>`;
        } else {
            icd11Table.innerHTML = '<tr><td colspan="3" class="no-results">No ICD-11 concepts matched that search</td></tr>';
        }

        document.getElementById('results').style.display = 'block';
    }

    function showError(msg) {
        const el = document.getElementById('errorMessage');
        el.textContent = msg;
        el.style.display = 'block';
    }

    // Translate NAMASTE → ICD-11
    async function translateCode(code, name) {
        let section = document.getElementById('translationSection');
        if (!section) {
            document.getElementById('results').insertAdjacentHTML('afterend', `
                <div id="translationSection" style="margin-top:1.5rem;background:#fff;border:1px solid #d0dae6;border-left:4px solid #1976d2;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(15,39,68,0.07);">
                    <div style="padding:0.85rem 1.25rem;background:#e3f0ff;border-bottom:1px solid #c5ddf5;">
                        <h5 style="color:#0d1f35;margin:0;display:flex;align-items:center;gap:0.5rem;font-size:0.875rem;font-weight:700;">
                            <i class="fas fa-exchange-alt" style="color:#1976d2;"></i> Code Translation
                        </h5>
                    </div>
                    <div style="padding:1.25rem;" id="translationResults"></div>
                </div>`);
            section = document.getElementById('translationSection');
        }
        const out = document.getElementById('translationResults');
        out.innerHTML = `<p style="color:#607080;font-size:0.845rem;">Translating <span class="code-badge">${escHtml(code)}</span>…</p>`;

        try {
            const res = await fetch(`/translate_code?code=${encodeURIComponent(code)}&system=namaste`);
            const data = await res.json();
            if (data.success) {
                out.innerHTML = `<div style="background:#e2f5ec;border:1px solid #a7d7bc;padding:0.9rem 1rem;border-radius:8px;">
                    <div style="margin-bottom:0.4rem;color:#2c3e55;font-size:0.845rem;">Source: <span class="code-badge">${escHtml(data.source.code)}</span> ${escHtml(data.source.name)}</div>
                    <div style="color:#2c3e55;font-size:0.845rem;">ICD-11: <span class="code-badge icd11">${escHtml(data.target.code)}</span> ${escHtml(data.target.name)}</div>
                </div>`;
            } else {
                out.innerHTML = `<div style="color:#92400e;padding:0.75rem;background:#fef3e2;border:1px solid #f0d9a0;border-radius:8px;font-size:0.845rem;">${escHtml(data.message)}</div>`;
            }
        } catch (e) {
            out.innerHTML = `<div class="error-message">Translation failed: ${e.message}</div>`;
        }
        section.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
</script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
