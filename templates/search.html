<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Medical Codes - HealthBridge EMR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/futuristic-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .search-container {
            max-width: 1200px;
            margin: 2rem auto;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: fadeInUp 0.8s ease-out;
        }
        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(0,212,255,0.2);
        }
        .search-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg,#00d4ff,#5b73ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        .back-btn {
            padding: 10px 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .back-btn:hover { background: rgba(255,255,255,0.15); color: white; transform: translateY(-2px); }

        /* ── Search bar + autocomplete ── */
        .search-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1.5rem;
            align-items: end;
            margin-bottom: 2rem;
        }
        .search-input-wrap { position: relative; }
        .search-label {
            display: block;
            color: rgba(255,255,255,0.8);
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .search-input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            color: white;
            font-size: 1.1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .search-input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 0 3px rgba(0,212,255,0.1), 0 0 25px rgba(0,212,255,0.2);
            background: rgba(255,255,255,0.08);
        }
        .search-input::placeholder { color: rgba(255,255,255,0.4); }

        /* Autocomplete dropdown */
        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0; right: 0;
            background: rgba(15,20,40,0.97);
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 12px;
            z-index: 999;
            max-height: 320px;
            overflow-y: auto;
            box-shadow: 0 16px 40px rgba(0,0,0,0.5);
            display: none;
        }
        .autocomplete-dropdown.open { display: block; }
        .ac-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.15s;
            gap: 1rem;
        }
        .ac-item:last-child { border-bottom: none; }
        .ac-item:hover, .ac-item.active { background: rgba(0,212,255,0.1); }
        .ac-name { color: white; font-size: 0.95rem; font-weight: 500; }
        .ac-name em { color: #00d4ff; font-style: normal; font-weight: 700; }
        .ac-meta { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
        .ac-code {
            background: rgba(81,207,102,0.2);
            color: #51cf66;
            padding: 2px 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8rem;
        }
        .ac-system {
            background: rgba(0,212,255,0.15);
            color: #00d4ff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
        }
        .ac-loading {
            padding: 1rem;
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
        }

        .search-btn {
            padding: 16px 32px;
            background: linear-gradient(135deg,#00d4ff,#5b73ff);
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            white-space: nowrap;
        }
        .search-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 35px rgba(0,212,255,0.4); }
        .search-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Spinner */
        .loading-spinner { display: flex; justify-content: center; align-items: center; padding: 3rem; color: #00d4ff; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(0,212,255,0.2); border-top: 4px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }

        /* Results */
        .results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 2rem; }
        .results-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .results-header { padding: 1.2rem 1.5rem; border-bottom: 1px solid rgba(0,212,255,0.15); }
        .results-header.namaste { background: rgba(0,212,255,0.08); }
        .results-header.icd11  { background: rgba(81,207,102,0.08); }
        .results-title { color: white; font-weight: 600; font-size: 1rem; margin: 0; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
        .results-table { width: 100%; color: white; border-collapse: collapse; }
        .results-table th { background: rgba(0,0,0,0.2); color: rgba(255,255,255,0.7); font-weight: 500; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; padding: 0.8rem 1rem; }
        .results-table td { padding: 0.9rem 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.88rem; }
        .results-table tr:hover { background: rgba(0,212,255,0.04); }
        .code-badge { background: rgba(0,212,255,0.2); color: #00d4ff; padding: 3px 8px; border-radius: 6px; font-family: monospace; font-size: 0.82rem; }
        .code-badge.icd11 { background: rgba(81,207,102,0.2); color: #51cf66; }
        .system-badge { background: linear-gradient(135deg,#00d4ff,#5b73ff); color: white; padding: 3px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: 500; }
        .system-badge.icd11 { background: linear-gradient(135deg,#51cf66,#40c057); }
        .ai-badge { background: linear-gradient(135deg,#a855f7,#6366f1); color: white; padding: 3px 10px; border-radius: 12px; font-size: 0.72rem; font-weight: 500; }
        .translate-btn { padding: 5px 10px; background: linear-gradient(135deg,#ffd43b,#fab005); border: none; border-radius: 12px; color: #333; font-weight: 500; font-size: 0.72rem; cursor: pointer; transition: all 0.2s; }
        .translate-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(255,212,59,0.4); }
        .no-results { text-align: center; padding: 2rem; color: rgba(255,255,255,0.5); font-style: italic; }
        .error-message { background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.2); color: #ff6b6b; padding: 1rem; border-radius: 12px; margin-top: 1rem; }

        @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
        @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }

        @media(max-width:768px) {
            .search-container { margin:1rem; padding:2rem 1.5rem; }
            .search-row { grid-template-columns:1fr; gap:1rem; }
            .results-grid { grid-template-columns:1fr; gap:1.5rem; }
            .search-header { flex-direction:column; gap:1rem; text-align:center; }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <div class="dashboard-sidebar">
        <div class="sidebar-header">
            <div style="display:flex;align-items:center;justify-content:center;gap:0.5rem;margin-bottom:0.5rem;">
                <img src="/static/logo.png" alt="HealthBridge Logo" style="width:32px;height:32px;object-fit:contain;">
                <h4 style="margin:0;">HealthBridge</h4>
            </div>
            <small>Doctor Portal</small>
        </div>
        <nav class="sidebar-nav">
            <a href="/enhanced/dashboard" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="/patients/add" class="nav-link"><i class="fas fa-user-plus"></i> New Patient</a>
            <a href="/patients/" class="nav-link"><i class="fas fa-users"></i> Patients</a>
            <a href="/reports/" class="nav-link"><i class="fas fa-chart-line"></i> Reports</a>
            <a href="/fhir/" class="nav-link"><i class="fas fa-database"></i> FHIR</a>
            <a href="/search-page" class="nav-link"><i class="fas fa-search"></i> Search Code</a>
            <a href="/diagnosis-page" class="nav-link"><i class="fas fa-save"></i> Save Diagnosis</a>
            <a href="/history-page" class="nav-link"><i class="fas fa-history"></i> Patient History</a>
            <hr style="border-color:rgba(0,212,255,0.2);margin:1rem 0;">
            <a href="/enhanced/logout" class="nav-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="top-navbar">
            <div>
                <button class="mobile-menu-toggle" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></button>
                <h5><i class="fas fa-search"></i> Search Medical Codes</h5>
            </div>
        </div>

        <div class="content-area">
            <div class="search-container">
                <div class="search-header">
                    <h2 class="search-title"><i class="fas fa-search"></i> Medical Code Search</h2>
                    <a href="javascript:history.back()" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
                </div>

                <div class="search-row">
                    <div class="search-input-wrap">
                        <label class="search-label">Enter Disease, Symptom or Condition</label>
                        <input type="text" class="search-input" id="symptomInput"
                               placeholder="e.g., Jwara, Diabetes, Parkinson, Amavata, Dengue…"
                               autocomplete="off">
                        <div class="autocomplete-dropdown" id="acDropdown"></div>
                    </div>
                    <button class="search-btn" id="searchBtn" onclick="searchCodes()">
                        <i class="fas fa-search"></i> Search
                    </button>
                </div>

                <div id="loadingSpinner" class="loading-spinner" style="display:none;">
                    <div class="spinner"></div>
                </div>

                <div id="results" style="display:none;">
                    <div class="results-grid">
                        <!-- NAMASTE -->
                        <div class="results-card">
                            <div class="results-header namaste">
                                <h5 class="results-title">
                                    <i class="fas fa-leaf"></i> NAMASTE Codes (AYUSH)
                                    <span id="namasteSourceBadge" class="system-badge" style="font-size:0.7rem;"></span>
                                </h5>
                            </div>
                            <table class="results-table">
                                <thead><tr><th>Code</th><th>Name</th><th>System</th><th>Action</th></tr></thead>
                                <tbody id="namasteResults"></tbody>
                            </table>
                        </div>

                        <!-- ICD-11 -->
                        <div class="results-card">
                            <div class="results-header icd11">
                                <h5 class="results-title">
                                    <i class="fas fa-globe"></i> ICD-11 Codes (WHO)
                                    <span class="ai-badge">✨ AI Powered</span>
                                </h5>
                            </div>
                            <table class="results-table">
                                <thead><tr><th>Code</th><th>Condition Name</th><th>System</th></tr></thead>
                                <tbody id="icd11Results"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="errorMessage" class="error-message" style="display:none;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleMobileMenu() {
        document.querySelector('.dashboard-sidebar').classList.toggle('mobile-open');
    }

    // ── Autocomplete ──────────────────────────────────────────────────────────
    let acTimeout = null;
    let acIndex = -1;
    let acController = null;   // AbortController for in-flight suggest requests

    const input = document.getElementById('symptomInput');
    const dropdown = document.getElementById('acDropdown');

    input.addEventListener('input', function () {
        clearTimeout(acTimeout);
        const val = this.value.trim();
        if (val.length < 1) { closeDropdown(); return; }
        dropdown.innerHTML = '<div class="ac-loading"><i class="fas fa-spinner fa-spin"></i> Fetching suggestions…</div>';
        dropdown.classList.add('open');
        acTimeout = setTimeout(() => fetchSuggestions(val), 600);
    });

    input.addEventListener('keydown', function (e) {
        const items = dropdown.querySelectorAll('.ac-item');
        if (!items.length) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); acIndex = Math.min(acIndex + 1, items.length - 1); highlightItem(items); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); acIndex = Math.max(acIndex - 1, 0); highlightItem(items); }
        else if (e.key === 'Enter') {
            if (acIndex >= 0 && items[acIndex]) { items[acIndex].click(); }
            else { closeDropdown(); searchCodes(); }
        }
        else if (e.key === 'Escape') { closeDropdown(); }
    });

    document.addEventListener('click', function (e) {
        if (!e.target.closest('.search-input-wrap')) closeDropdown();
    });

    function highlightItem(items) {
        items.forEach((el, i) => el.classList.toggle('active', i === acIndex));
        if (items[acIndex]) items[acIndex].scrollIntoView({ block: 'nearest' });
    }

    function closeDropdown() {
        dropdown.classList.remove('open');
        dropdown.innerHTML = '';
        acIndex = -1;
    }

    async function fetchSuggestions(prefix) {
        // Cancel any previous in-flight request
        if (acController) acController.abort();
        acController = new AbortController();
        try {
            const res = await fetch(`/icd11/suggest?q=${encodeURIComponent(prefix)}`,
                { signal: acController.signal });
            const data = await res.json();
            renderSuggestions(data, prefix);
        } catch (e) {
            if (e.name !== 'AbortError') closeDropdown();
        }
    }

    function renderSuggestions(items, prefix) {
        if (!items || !items.length) { closeDropdown(); return; }
        acItems = items;
        acIndex = -1;
        const re = new RegExp(`(${prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        dropdown.innerHTML = items.map((item, i) => {
            const highlighted = item.name.replace(re, '<em>$1</em>');
            const sys = item.system || 'Modern';
            return `<div class="ac-item" data-index="${i}" onclick="selectSuggestion('${escHtml(item.name)}','${escHtml(item.icd_code)}')">
                <span class="ac-name">${highlighted}</span>
                <span class="ac-meta">
                    <span class="ac-code">${escHtml(item.icd_code)}</span>
                    <span class="ac-system">${escHtml(sys)}</span>
                </span>
            </div>`;
        }).join('');
        dropdown.classList.add('open');
    }

    function selectSuggestion(name, code) {
        input.value = name;
        closeDropdown();
        searchCodes();
    }

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Full search ───────────────────────────────────────────────────────────
    async function searchCodes() {
        const symptom = input.value.trim();
        if (!symptom) { showError('Please enter a disease or symptom.'); return; }
        closeDropdown();

        const btn = document.getElementById('searchBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Searching…';
        document.getElementById('loadingSpinner').style.display = 'flex';
        document.getElementById('results').style.display = 'none';
        document.getElementById('errorMessage').style.display = 'none';

        try {
            const res = await fetch(`/search?q=${encodeURIComponent(symptom)}`);
            const data = await res.json();
            if (res.ok) displayResults(data);
            else showError(data.error || 'Search failed');
        } catch (e) {
            showError('Network error: ' + e.message);
        } finally {
            document.getElementById('loadingSpinner').style.display = 'none';
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-search"></i> Search';
        }
    }

    function displayResults(data) {
        const namasteTable = document.getElementById('namasteResults');
        const icd11Table   = document.getElementById('icd11Results');
        namasteTable.innerHTML = '';
        icd11Table.innerHTML   = '';

        // NAMASTE source badge
        const srcBadge = document.getElementById('namasteSourceBadge');
        srcBadge.textContent = data.namaste_source === 'api' ? 'Official API' : 'CSV Data';
        srcBadge.style.background = data.namaste_source === 'api'
            ? 'linear-gradient(135deg,#51cf66,#40c057)'
            : 'linear-gradient(135deg,#ffd43b,#fab005)';

        // NAMASTE rows
        if (data.namaste && data.namaste.length) {
            data.namaste.forEach(item => {
                namasteTable.innerHTML += `<tr>
                    <td><span class="code-badge">${escHtml(item.code)}</span></td>
                    <td>${escHtml(item.name)}</td>
                    <td><span class="system-badge">${escHtml(item.system||'NAMASTE')}</span></td>
                    <td><button class="translate-btn" onclick="translateCode('${escHtml(item.code)}','${escHtml(item.name)}')">
                        <i class="fas fa-exchange-alt"></i> Translate
                    </button></td>
                </tr>`;
            });
        } else {
            namasteTable.innerHTML = '<tr><td colspan="4" class="no-results">No NAMASTE results found</td></tr>';
        }

        // ICD-11 rows
        if (data.icd11 && data.icd11.length) {
            data.icd11.forEach(item => {
                icd11Table.innerHTML += `<tr>
                    <td><span class="code-badge icd11">${escHtml(item.code)}</span></td>
                    <td>${escHtml(item.name)}</td>
                    <td><span class="system-badge icd11">${escHtml(item.category||'ICD-11')}</span></td>
                </tr>`;
            });
        } else {
            icd11Table.innerHTML = '<tr><td colspan="3" class="no-results">No ICD-11 results — check your Gemini API key</td></tr>';
        }

        document.getElementById('results').style.display = 'block';
    }

    function showError(msg) {
        const el = document.getElementById('errorMessage');
        el.textContent = msg;
        el.style.display = 'block';
    }

    // Translate NAMASTE → ICD-11
    async function translateCode(code, name) {
        let section = document.getElementById('translationSection');
        if (!section) {
            document.getElementById('results').insertAdjacentHTML('afterend', `
                <div id="translationSection" style="margin-top:2rem;background:rgba(255,255,255,0.05);border:1px solid rgba(255,212,59,0.3);border-radius:16px;overflow:hidden;">
                    <div style="padding:1.2rem 1.5rem;background:rgba(255,212,59,0.08);border-bottom:1px solid rgba(255,212,59,0.2);">
                        <h5 style="color:#ffd43b;margin:0;display:flex;align-items:center;gap:0.5rem;">
                            <i class="fas fa-exchange-alt"></i> Code Translation
                        </h5>
                    </div>
                    <div style="padding:1.5rem;" id="translationResults"></div>
                </div>`);
            section = document.getElementById('translationSection');
        }
        const out = document.getElementById('translationResults');
        out.innerHTML = `<p style="color:rgba(255,255,255,0.6);">Translating <span class="code-badge">${escHtml(code)}</span>…</p>`;

        try {
            const res = await fetch(`/translate_code?code=${encodeURIComponent(code)}&system=namaste`);
            const data = await res.json();
            if (data.success) {
                out.innerHTML = `<div style="background:rgba(81,207,102,0.08);border:1px solid rgba(81,207,102,0.2);padding:1rem;border-radius:12px;">
                    <div style="margin-bottom:0.5rem;color:rgba(255,255,255,0.7);">Source: <span class="code-badge">${escHtml(data.source.code)}</span> ${escHtml(data.source.name)}</div>
                    <div>ICD-11: <span class="code-badge icd11">${escHtml(data.target.code)}</span> ${escHtml(data.target.name)}</div>
                </div>`;
            } else {
                out.innerHTML = `<div style="color:#ffd43b;padding:0.75rem;background:rgba(255,212,59,0.08);border-radius:8px;">${escHtml(data.message)}</div>`;
            }
        } catch (e) {
            out.innerHTML = `<div class="error-message">Translation failed: ${e.message}</div>`;
        }
        section.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
</script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
