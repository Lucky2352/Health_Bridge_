<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient History - HealthBridge EMR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/futuristic-dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .form-container {
            max-width: 1200px;
            margin: 2rem auto;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-left: 4px solid var(--blue-mid);
            border-radius: var(--radius-lg);
            padding: 2rem 2.25rem;
            box-shadow: var(--shadow-sm);
            animation: fadeInUp 0.5s ease-out;
        }

        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.75rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--blue-light);
        }

        .form-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-heading);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.55rem;
        }

        .form-title i { color: var(--blue-mid); }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.25rem;
            margin-bottom: 1.25rem;
        }

        .form-group {
            position: relative;
            align-self: end;
        }

        .form-label {
            display: block;
            margin-bottom: 0.45rem;
            color: var(--text-heading);
            font-weight: 600;
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            padding: 0.7rem 0.95rem;
            background: #ffffff;
            border: 1.5px solid var(--border);
            border-radius: 9px;
            color: var(--text-body);
            font-size: 0.92rem;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .form-control:hover {
            border-color: #94a3b8;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--blue-mid);
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.13);
            background: #ffffff;
            color: var(--text-heading);
        }

        .form-control::placeholder {
            color: var(--text-light);
            opacity: 1;
        }

        .btn {
            padding: 0.65rem 1.4rem;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.86rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            letter-spacing: 0.2px;
        }

        .btn-primary {
            background: var(--blue-mid);
            color: #ffffff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background: var(--blue);
            box-shadow: 0 4px 12px rgba(21, 101, 192, 0.3);
            color: #ffffff;
        }

        .btn-success {
            background: var(--green);
            color: #ffffff;
        }

        .btn-success:hover {
            background: #155d38;
            box-shadow: 0 4px 12px rgba(27, 122, 74, 0.3);
            color: #ffffff;
        }

        .results-container {
            background: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-top: 2rem;
            animation: fadeInUp 0.4s ease-out;
        }

        .results-title {
            color: var(--text-heading);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .results-title i { color: var(--blue-mid); }

        .table-container {
            background: #ffffff;
            border: 1px solid var(--border-light);
            border-radius: 10px;
            overflow: hidden;
        }

        .table {
            margin: 0;
            color: var(--text-body);
        }

        .table th {
            background: var(--blue-light);
            border: none;
            color: var(--blue);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            padding: 0.85rem 1rem;
        }

        .table td {
            border: none;
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border-light);
            color: var(--text-body);
            font-size: 0.875rem;
        }

        .table tbody tr:last-child td { border-bottom: none; }

        .table tbody tr:hover {
            background: #f5f9ff;
        }

        .no-results {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            color: var(--blue-mid);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(25, 118, 210, 0.2);
            border-top: 3px solid var(--blue-mid);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            padding: 0.85rem 1.1rem;
            border-radius: 8px;
            margin-top: 1rem;
            border: 1px solid;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .alert-danger {
            background: var(--red-light);
            border-color: #fca5a5;
            color: #991b1b;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal {
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            margin: 5% auto;
            padding: 0;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            animation: modalSlideIn 0.25s ease-out;
        }

        .modal-header {
            background: var(--blue-light);
            padding: 1.15rem 1.5rem;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            color: var(--text-heading);
            margin: 0;
            font-weight: 700;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .modal-header h3 i { color: var(--blue-mid); }

        .close {
            color: var(--text-muted);
            font-size: 1.8rem;
            line-height: 1;
            font-weight: 400;
            cursor: pointer;
            background: none;
            border: none;
            transition: all 0.2s ease;
        }

        .close:hover {
            color: var(--text-heading);
            background: rgba(15, 39, 68, 0.06);
        }

        .modal-body {
            padding: 1.5rem;
            max-height: 60vh;
            overflow-y: auto;
        }

        .modal-actions {
            margin-bottom: 1rem;
            text-align: right;
        }

        .json-viewer {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
            color: var(--text-body);
            font-family: 'Courier New', monospace;
            font-size: 0.82rem;
            line-height: 1.5;
            max-height: 400px;
            overflow: auto;
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .btn-fhir {
            background: var(--blue-light);
            border: 1px solid #bcd7f5;
            color: var(--blue);
            padding: 0.4rem 0.8rem;
            border-radius: 7px;
            font-size: 0.76rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-fhir:hover {
            background: #d6e8fd;
            border-color: var(--blue-mid);
            color: var(--blue);
            transform: translateY(-1px);
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .form-container {
                margin: 1rem;
                padding: 1.5rem 1.25rem;
            }
            
            .form-header {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }

            .form-title { justify-content: center; }
            
            .modal-content {
                width: 95%;
                margin: 10% auto;
            }
            
            .modal-body {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-sidebar">
            <div class="sidebar-header">
                <div style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                    <img src="/static/logo.png" alt="HealthBridge Logo" style="width: 32px; height: 32px; object-fit: contain;">
                    <h4 style="margin: 0;">HealthBridge</h4>
                </div>
                <small>Doctor Portal</small>
            </div>
            <nav class="sidebar-nav">
                <a href="/enhanced/dashboard" class="nav-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="/patients/add" class="nav-link"><i class="fas fa-user-plus"></i> New Patient</a>
                <a href="/patients/" class="nav-link"><i class="fas fa-users"></i> Patients</a>
                <a href="/treatments/" class="nav-link"><i class="fas fa-heartbeat"></i> Treatment Plans</a>
                <a href="/appointments/" class="nav-link"><i class="fas fa-calendar-check"></i> Appointments</a>
                <a href="/reports/" class="nav-link"><i class="fas fa-chart-line"></i> Reports</a>
                <a href="/fhir/" class="nav-link"><i class="fas fa-database"></i> FHIR</a>
                <a href="/search-page" class="nav-link"><i class="fas fa-search"></i> Search Code</a>
                <a href="/diagnosis-page" class="nav-link"><i class="fas fa-save"></i> Save Diagnosis</a>
                <a href="/history-page" class="nav-link"><i class="fas fa-history"></i> Patient History</a>
                <hr style="border: none; border-top: 1px solid var(--border); opacity: 0.25; margin: 1rem 0;">
                <a href="/enhanced/logout" class="nav-link"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </div>

        <div class="main-content">
            <div class="top-navbar">
                <div>
                    <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h5><i class="fas fa-history"></i> Patient History</h5>
                </div>
            </div>

            <div class="content-area">
                <div class="form-container">
                    <div class="form-header">
                        <h2 class="form-title"><i class="fas fa-history"></i> Patient Diagnosis History</h2>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="patientIdInput" class="form-label">Patient ID *</label>
                            <input type="text" class="form-control" id="patientIdInput" placeholder="e.g., P123" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Actions</label>
                            <button class="btn btn-primary" onclick="loadHistory()">
                                <i class="fas fa-search"></i> Load History
                            </button>
                        </div>
                    </div>



                    <div id="loadingSpinner" class="loading-spinner" style="display: none;">
                        <div class="spinner"></div>
                    </div>

                    <div id="historyResults" class="results-container" style="display: none;">
                        <h4 id="historyTitle" class="results-title"></h4>
                        
                        <!-- Table format for regular JSON -->
                        <div id="tableView">
                            <div class="table-container">
                                <table class="table">
                                    <thead>
                                        <tr>
                                            <th><i class="fas fa-calendar me-1"></i>Date</th>
                                            <th><i class="fas fa-stethoscope me-1"></i>Symptom</th>
                                            <th><i class="fas fa-code me-1"></i>NAMASTE Code</th>
                                            <th><i class="fas fa-code me-1"></i>ICD-11 Code</th>
                                            <th><i class="fas fa-cog me-1"></i>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="historyTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                        

                    </div>

                    <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- FHIR Modal -->
    <div id="fhirModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-file-code"></i> FHIR Patient Resource</h3>
                <span class="close" onclick="closeFhirModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="modal-actions">
                    <button class="btn btn-success" onclick="downloadFhir()">
                        <i class="fas fa-download"></i> Download JSON
                    </button>
                </div>
                <pre id="fhirContent" class="json-viewer"></pre>
            </div>
        </div>
    </div>
    <script>
        async function loadHistory() {
            const patientId = document.getElementById('patientIdInput').value.trim();
            if (!patientId) {
                showError('Please enter a Patient ID');
                return;
            }

            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('historyResults').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';

            try {
                const response = await fetch(`/patient/${patientId}/history`);
                const data = await response.json();

                if (response.ok) {
                    displayHistory(data, patientId);
                } else {
                    showError(data.error || 'Failed to load history');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                document.getElementById('loadingSpinner').style.display = 'none';
            }
        }

        function displayHistory(data, patientId) {
            const patientName = data.patient_name ? ` (${data.patient_name})` : '';
            document.getElementById('historyTitle').textContent = `History for Patient: ${patientId}${patientName}`;
            
            const tableBody = document.getElementById('historyTableBody');
            tableBody.innerHTML = '';

            if (data.records && data.records.length > 0) {
                data.records.forEach(record => {
                    const date = record.timestamp ? new Date(record.timestamp).toLocaleDateString() : 'N/A';
                    const row = `<tr>
                        <td>${date}</td>
                        <td>${record.symptom || 'N/A'}</td>
                        <td>${record.namaste_code || '-'}</td>
                        <td>${record.icd11_code || '-'}</td>
                        <td>
                            <button class="btn-fhir" onclick="showFhir('${patientId}')" title="View FHIR Format">
                                <i class="fas fa-file-code"></i> FHIR
                            </button>
                        </td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } else {
                tableBody.innerHTML = '<tr><td colspan="5" class="no-results">No patient history found for this Patient ID</td></tr>';
            }

            document.getElementById('historyResults').style.display = 'block';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // FHIR Modal Functions
        let currentFhirData = null;
        let currentPatientId = null;

        async function showFhir(patientId) {
            try {
                const response = await fetch(`/patients/${patientId}/fhir`);
                const data = await response.json();

                if (response.ok) {
                    currentFhirData = data;
                    currentPatientId = patientId;
                    document.getElementById('fhirContent').textContent = JSON.stringify(data, null, 2);
                    document.getElementById('fhirModal').style.display = 'block';
                } else {
                    showError(data.error || 'Failed to load FHIR data');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            }
        }

        function closeFhirModal() {
            document.getElementById('fhirModal').style.display = 'none';
        }

        function downloadFhir() {
            if (!currentFhirData || !currentPatientId) return;
            
            const dataStr = JSON.stringify(currentFhirData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `patient_${currentPatientId}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('fhirModal');
            if (event.target === modal) {
                closeFhirModal();
            }
        }

        // Allow Enter key to trigger search
        document.getElementById('patientIdInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loadHistory();
            }
        });


    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
